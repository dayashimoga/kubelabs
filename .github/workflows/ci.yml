name: KubeLabs Production CI/CD & Acceptance Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  code-quality-and-audits:
    name: Lint, Curriculum & Catalog Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 729-Exercise Catalog Runtime & Duplicate Audit
        run: python scripts/audit_exercise_runtime_matrix.py

      - name: Run Curriculum Teaching Quality & Prerequisite Graph Audit
        run: python scripts/audit_curriculum_teaching_quality.py

      - name: Run Multi-Viewport Visual Regression & Layout Conformance
        run: python scripts/run_visual_regression.py

      - name: Run Cloud Truthfulness & Disposable AWS Check
        run: python scripts/aws_disposable_acceptance.py

  backend-tests:
    name: Backend Test Suite & 90% Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Unit & Integration Tests (>=90% Coverage Enforced)
        run: |
          pytest tests/ -v --cov=packages --cov=apps.api.src --cov-fail-under=90 --cov-report=term-missing

      - name: Run Adversarial Security & Isolation Suite
        run: pytest tests/adversarial -v

      - name: Run Concurrency, Load & Zero-Residue Sweeper Test
        run: python scripts/load_test.py

      - name: Run FAST Acceptance Gate
        run: python scripts/verify_acceptance.py --fast

  frontend-tests:
    name: Frontend Test Suite, 90% Coverage & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run Frontend Tests & 90% Coverage Gate
        working-directory: apps/web
        run: npm run test:coverage

      - name: Compile TypeScript & Vite Production Bundle
        working-directory: apps/web
        run: npm run build

  full-production-acceptance:
    name: Full End-to-End Podman & K8s Runtime Acceptance
    runs-on: ubuntu-latest
    needs: [code-quality-and-audits, backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Run FULL 18-Gate Acceptance Suite (Genuine Containers & Zero Residue)
        run: python scripts/verify_acceptance.py --full
