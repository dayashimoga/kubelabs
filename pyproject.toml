[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kubelabs"
version = "1.0.0"
description = "Production-Ready DevOps & SRE Hands-on Learning and Troubleshooting Platform"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["packages", "apps/api/src"]
omit = ["tests/*"]
